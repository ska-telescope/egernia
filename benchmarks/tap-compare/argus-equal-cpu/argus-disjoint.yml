# Amendment 1 of the equal-CPU variant (PROTOCOL.md): argus on its own
# eight cores. With both stacks on one shared cpuset the server that is
# not being measured must be idle, and argus is not: Tomcat keeps
# executing the requests its queue still holds after the generator has
# closed its connections, so argus's PostgreSQL ran at ~4.5 cores for up
# to ~75 s into egernia's rungs (measured 2026-09-08 06:11-06:13Z). Each
# server still gets exactly eight cores and its 8 GiB; the generators
# stay on cores 24-29.
#
#   docker compose -f benchmarks/tap-compare/docker-compose.argus.yml \
#       -f benchmarks/tap-compare/argus-equal-cpu/argus-disjoint.yml up -d
services:
  argus:
    cpuset: "8-15"
  argus-db:
    cpuset: "8-15"

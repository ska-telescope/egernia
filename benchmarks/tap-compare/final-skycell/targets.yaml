# The skycell rerun's targets (PROTOCOL.md). Lane A only: every target is a
# locally deployed server the operator controls.
#
# DaCHS and argus keep final/'s and scaling-three-way/'s names: their pins
# here are byte copies of those protocols'. egernia's targets are renamed
# (egernia-skycell-*) because its deployment differs, and the publisher
# describes a stack by its target name. Every egernia target is the repository's docker-compose.yml
# stack with final-skycell/pins/skycell.yml on top, except
# egernia-ab-pgsphere, which is the A/B's pg_sphere control.
targets:
  # Experiment 1, the backend A/B
  - name: egernia-ab-skycell
    server: egernia
    base_url: http://localhost:8080/tap
    portable_only: true
    notes: >-
      egernia on skycell v0.58, compose project `egernia` under
      final-skycell/pins/egernia-w1.yml + skycell.yml: cpuset 0-7, 8 GiB as
      4 db / 2 api / 2 executor, TAP_API_WORKERS=1.
  - name: egernia-ab-pgsphere
    server: egernia
    base_url: http://localhost:18080/tap
    portable_only: true
    notes: >-
      The same images on pg_sphere, compose project `egernia-pgs` with its own
      seeded volume, under final-skycell/pins/egernia-ab-pgsphere.yml: the
      same budget and worker count on cpuset 8-15, host ports 15432/18080.

  # Experiment 2, the three-way phases (final/'s targets, egernia on skycell)
  - name: egernia-skycell-w1
    server: egernia
    base_url: http://localhost:8080/tap
    portable_only: true
    notes: >-
      Phase A. egernia on skycell v0.58 under final-skycell/pins/egernia-w1.yml
      + skycell.yml: cpuset 0-7, 8 GiB as 4 db / 2 api / 2 executor,
      TAP_API_WORKERS=1, ivoa.obscore the denormalised table, one database.
  - name: egernia-skycell-w8
    server: egernia
    base_url: http://localhost:8080/tap
    portable_only: true
    notes: >-
      Phase B. The same stack under final-skycell/pins/egernia-w8.yml +
      skycell.yml: TAP_API_WORKERS=8 and PostgreSQL's parallel budget
      re-derived for the pool total, exactly as final/ phase B.
  - name: dachs-final
    server: dachs
    base_url: http://localhost:8081/tap
    portable_only: true
    notes: >-
      GAVO DaCHS from the Debian gavodachs2-server package
      (benchmarks/tap-compare/docker-compose.dachs.yml), rebuilt and
      re-ingested for this protocol, under final-skycell/pins/dachs.yml:
      cpus 8 on cpuset 16-23, 8 GiB, its PostgreSQL sized by the 1/4 rule.
      Unchanged between the phases.
  - name: argus-final
    server: argus
    base_url: http://localhost/argus
    portable_only: true
    notes: >-
      CADC argus 1.0.27 from its digest-pinned vendor image over PostgreSQL
      17 + pgsphere (benchmarks/tap-compare/docker-compose.argus.yml), the
      corpus as a plain caom2.obscore table, under
      final-skycell/pins/argus.yml: cpuset 8-15. Unchanged between the
      phases, its UWS job store truncated before each.

  # Experiment 3, the three-way scaling tiers (scaling-three-way/'s targets)
  - name: egernia-skycell-scaling3
    server: egernia
    base_url: http://localhost:8080/tap
    portable_only: true
    notes: >-
      egernia on skycell v0.58 under final-skycell/pins/egernia-<tier>.yml +
      skycell.yml: the tier's cpuset, memory split 1/2 db, 1/4 api, 1/4
      executor, API workers 1/2/4, PostgreSQL sized by
      docs/postgres-performance.md.
  - name: dachs-scaling3
    server: dachs
    base_url: http://localhost:8081/tap
    portable_only: true
    notes: >-
      DaCHS as dachs-final, under final-skycell/pins/dachs-<tier>.yml: the
      tier's cpus, cpuset and memory, its PostgreSQL sized by the 1/4 rule.
  - name: argus-scaling3
    server: argus
    base_url: http://localhost/argus
    portable_only: true
    notes: >-
      argus as argus-final, under final-skycell/pins/argus-<tier>.yml: the
      tier's cpuset, the 3/8 Tomcat + 5/8 PostgreSQL memory split, the vendor
      JVM defaults, its UWS job store truncated before every block.

# The final three-way comparison: DaCHS's PostgreSQL sized to its 8 GiB /
# 8-CPU container by the rule in docs/postgres-performance.md —
# shared_buffers 1/4 and effective_cache_size 3/4 of the memory limit, and
# the same parallel budget egernia's and argus's databases get at this
# budget (DaCHS opened 8 active connections under 8 clients, so the stock
# cap of 8 parallel workers would starve its parallel plans exactly as
# PR #146 found for egernia). The values of scaling/pins/dachs-postgres-8.conf,
# repeated here so this protocol directory stands on its own.
shared_buffers = 2GB
effective_cache_size = 6GB
max_parallel_workers = 32
max_worker_processes = 40

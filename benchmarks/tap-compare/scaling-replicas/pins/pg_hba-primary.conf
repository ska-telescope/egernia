# The primary's client authentication for the read-replica tier
# (PROTOCOL.md). The image's generated file verbatim, plus the one line the
# standbys need: pg_basebackup and the walreceiver open a `replication`
# connection, and postgres:18 writes replication rules for localhost only.
# Passed as `-c hba_file=`, so the seeded data directory's own pg_hba.conf is
# left exactly as it was.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256

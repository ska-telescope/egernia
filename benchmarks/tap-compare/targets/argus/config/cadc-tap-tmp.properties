# Async results and inline uploads on the container's own disk (cadc-tap-tmp
# README, TempStorageManager); argus's web.xml serves them at /results, so
# the baseURL ends in /results as the argus README requires.
org.opencadc.tap.tmp.StorageManager = org.opencadc.tap.tmp.TempStorageManager
org.opencadc.tap.tmp.TempStorageManager.baseURL = http://localhost/argus/results
org.opencadc.tap.tmp.TempStorageManager.baseStorageDir = /tmp

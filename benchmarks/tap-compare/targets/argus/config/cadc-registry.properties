# cadc-registry.properties (opencadc/reg cadc-registry README: "All config in
# this file is now optional ... Failures should only occur if an actual
# lookup is attempted"). Deliberately empty: no registry baseURL, no local
# authority for CDP, GMS or UMS. Every lookup argus would make — the
# availability check's dependent-service probes, the group lookup behind
# proprietary-metadata filtering, DataLink resolution of publisher IDs —
# reports "not found" and is skipped, so a standalone argus never calls out
# to CADC's infrastructure. Anonymous callers see public rows only, which is
# every row of the corpus (metaRelease in the past, see db/init/02-obscore.sql).

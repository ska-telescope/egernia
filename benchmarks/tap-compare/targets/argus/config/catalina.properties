# argus's /config/catalina.properties (argus README; docker-base/cadc-tomcat
# README for the tomcat.connector.* keys). Appended to Tomcat's own at start.

# No TLS terminator in front: the scheme/host/port argus writes into
# capabilities, UWS job documents and async result URLs must be the address
# clients reach it by, exactly as DaCHS's serverURL. Port 80 because argus
# advertises default-port URLs only (targets/argus/Dockerfile).
tomcat.connector.connectionTimeout=20000
tomcat.connector.keepAliveTimeout=120000
tomcat.connector.secure=false
tomcat.connector.scheme=http
tomcat.connector.proxyName=localhost
tomcat.connector.proxyPort=80

# No ca.nrc.cadc.auth.IdentityManager: cadc-util's default is the
# NoOpIdentityManager, every caller anonymous (TLS off, auth off).

# The three connection pools argus requires, one database. maxActive is left
# to the deployer by the README ("{max connections for jobs pool}"); this
# deployment gives each pool one connection per pinned core — 8, which is
# also the pool egernia's API answers sync queries from (argus/PROTOCOL.md).
org.opencadc.argus.uws.maxActive=8
org.opencadc.argus.uws.username=tap
org.opencadc.argus.uws.password=tap
org.opencadc.argus.uws.url=jdbc:postgresql://argus-db/argus

org.opencadc.argus.tapadm.maxActive=8
org.opencadc.argus.tapadm.username=tap
org.opencadc.argus.tapadm.password=tap
org.opencadc.argus.tapadm.url=jdbc:postgresql://argus-db/argus

org.opencadc.argus.query.maxActive=8
org.opencadc.argus.query.username=tap
org.opencadc.argus.query.password=tap
org.opencadc.argus.query.url=jdbc:postgresql://argus-db/argus

# DaCHS at the 8 CPU / 8 GiB tier (../PROTOCOL.md): the parity compose
# file's limits raised to the tier, a cpuset, and its Debian PostgreSQL sized
# to the container by the same 1/4 rule every database here follows
# (dachs-postgres-8.conf, a conf.d drop-in). The sizing is
# scaling/pins/dachs-8.yml's; only the cpuset differs, because this
# protocol places three servers at tier 8 and one at a time above it.
#
#   docker compose -f benchmarks/tap-compare/docker-compose.dachs.yml \
#       -f benchmarks/tap-compare/scaling-three-way/pins/dachs-8.yml \
#       up -d --no-build --force-recreate
services:
  dachs:
    cpus: 8
    cpuset: "16-23"
    mem_limit: 8g
    volumes:
      # relative to the first compose file's directory (benchmarks/tap-compare)
      - ./scaling-three-way/pins/dachs-postgres-8.conf:/etc/postgresql/17/main/conf.d/90-tier.conf:ro
